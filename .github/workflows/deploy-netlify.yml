name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-demo-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claudetest
        uses: actions/checkout@v4

      - name: Checkout demo repo
        uses: actions/checkout@v4
        with:
          repository: gosuni2025/rpgmaker-mv-editor-demo
          token: ${{ secrets.DEMO_REPO_TOKEN }}
          path: demo

      - name: Sync demo-project
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='save' \
            --exclude='node_modules' \
            --exclude='.github' \
            ./ demo/demo-project/
          cd demo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync: demo-project update from $(cd .. && git rev-parse --short HEAD)"
            git pull --rebase origin main
            git push
          fi

  deploy-gosuni:
    runs-on: ubuntu-latest
    needs: sync-demo-project
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rebuild Docker on gosuni.com
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          ssh $DEPLOY_TARGET "
            cd ~/rpgmaker-demo &&
            docker build -t rpgmaker-demo . &&
            docker stop rpgmaker-demo && docker rm rpgmaker-demo &&
            docker run -d --name rpgmaker-demo --restart unless-stopped \
              -p 3100:3001 -e DEMO_MODE=true rpgmaker-demo &&
            echo 'Deploy complete'
          "

  deploy-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Get or create site ID
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          SITE_ID=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites" | \
            python3 -c "
          import json, sys
          sites = json.load(sys.stdin)
          s = next((s for s in sites if 'claudetest' in s.get('name', '')), None)
          print(s['id'] if s else '')
          ")
          echo "site_id=$SITE_ID" >> $GITHUB_OUTPUT

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          SITE_ID="${{ steps.site.outputs.site_id }}"
          if [ -z "$SITE_ID" ]; then
            echo "새 사이트 생성..."
            SITE_ID=$(netlify api createSite \
              --auth=$NETLIFY_AUTH_TOKEN \
              --data '{"name":"rpgmaker-mv-claudetest"}' | \
              python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "생성된 Site ID: $SITE_ID"
          fi
          netlify deploy --dir=. --prod \
            --site=$SITE_ID \
            --auth=$NETLIFY_AUTH_TOKEN
